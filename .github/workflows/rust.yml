name: Rust

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_CHECK_REVOKE: false

jobs:
  detect-projects:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.set-projects.outputs.projects }}
      changed_projects: ${{ steps.filter-projects.outputs.changed_projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch enough history for proper diff
          fetch-depth: 0

      - name: Find all Cargo projects
        id: set-projects
        run: |
          echo "🔍 Searching for Cargo projects..."

          # Alle Verzeichnisse mit Cargo.toml finden, target/ ausschließen
          projects=$(find . -name "Cargo.toml" -not -path "./target/*" -not -path "./.git/*" | xargs dirname | sort)

          # Debug: Gefundene Projekte anzeigen
          echo "Found Cargo projects:"
          echo "$projects"

          # Zu JSON Array konvertieren für Matrix
          if [ -n "$projects" ]; then
            projects_json=$(echo "$projects" | jq -R . | jq -s -c .)
            echo "projects=$projects_json" >> $GITHUB_OUTPUT
            echo "✅ Projects JSON: $projects_json"
          else
            echo "projects=[]" >> $GITHUB_OUTPUT
            echo "❌ No Cargo projects found"
          fi

      - name: Detect changed files and affected projects
        id: filter-projects
        run: |
          echo "📂 Detecting changed files and affected projects..."

          # Geänderte Dateien ermitteln basierend auf Event-Typ
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "🔄 Pull Request detected - comparing with base branch"
            git fetch origin ${{ github.base_ref }}
            changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            echo "📤 Push detected - comparing commits"
            if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }})
            else
              echo "ℹ️  Initial commit or force push - considering all files"
              changed_files=$(git ls-files)
            fi
          fi

          echo "Changed files:"
          echo "$changed_files"

          # Projekte finden, die von Änderungen betroffen sind
          affected_projects=()
          all_projects=$(find . -name "Cargo.toml" -not -path "./target/*" -not -path "./.git/*" | xargs dirname | sort)

          for project in $all_projects; do
            # Prüfen ob Dateien in diesem Projekt geändert wurden
            if echo "$changed_files" | grep -q "^${project#./}/" || echo "$changed_files" | grep -q "^${project#./}/"; then
              affected_projects+=("$project")
              echo "✅ Project affected: $project"
            fi
          done

          # Falls keine Projekte betroffen sind (z.B. nur README geändert), alle Projekte berücksichtigen
          if [ ${#affected_projects[@]} -eq 0 ]; then
            echo "ℹ️  No specific projects affected - including all projects as fallback"
            affected_projects=($all_projects)
          fi

          # JSON Array für betroffene Projekte erstellen
          if [ ${#affected_projects[@]} -gt 0 ]; then
            changed_projects_json=$(printf '%s\n' "${affected_projects[@]}" | jq -R . | jq -s -c .)
            echo "changed_projects=$changed_projects_json" >> $GITHUB_OUTPUT
            echo "🎯 Changed projects JSON: $changed_projects_json"
          else
            echo "changed_projects=[]" >> $GITHUB_OUTPUT
            echo "❌ No changed projects found"
          fi

  build:
    runs-on: ubuntu-latest
    needs: detect-projects
    # Nur für geänderte Projekte ausführen
    if: ${{ fromJson(needs.detect-projects.outputs.changed_projects)[0] }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-projects.outputs.changed_projects) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.project }}
          key: build-${{ matrix.project }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: |
          echo "🔨 Building changed project: ${{ matrix.project }}"
          echo "📦 Package info:"
          cargo read-manifest | jq '.name, .version' || echo "No manifest info available"

          cargo build --verbose

      - name: Test ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: |
          echo "🧪 Testing changed project: ${{ matrix.project }}"
          cargo test --verbose

  clippy:
    runs-on: ubuntu-latest
    needs: detect-projects
    # Nur für geänderte Projekte ausführen
    if: ${{ fromJson(needs.detect-projects.outputs.changed_projects)[0] }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-projects.outputs.changed_projects) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.project }}
          key: clippy-${{ matrix.project }}

      - name: Run Clippy for ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: |
          echo "🔍 Running Clippy for changed project: ${{ matrix.project }}"
          cargo clippy --all-targets --all-features -- -D warnings

  format:
    runs-on: ubuntu-latest
    needs: detect-projects
    # Nur für geänderte Projekte ausführen
    if: ${{ fromJson(needs.detect-projects.outputs.changed_projects)[0] }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-projects.outputs.changed_projects) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting for ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: |
          echo "📝 Checking format for changed project: ${{ matrix.project }}"
          cargo fmt --all -- --check

  # Summary Job für bessere Übersicht
  summary:
    runs-on: ubuntu-latest
    needs: [detect-projects, build, clippy, format]
    if: always()
    steps:
      - name: Job Summary
        run: |
          echo "## 🦀 Rust CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          all_projects='${{ needs.detect-projects.outputs.projects }}'
          changed_projects='${{ needs.detect-projects.outputs.changed_projects }}'

          all_count=$(echo "$all_projects" | jq '. | length')
          changed_count=$(echo "$changed_projects" | jq '. | length')

          echo "**Total projects:** $all_count" >> $GITHUB_STEP_SUMMARY
          echo "**Changed projects:** $changed_count" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "**Build Status:** ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Clippy Status:** ${{ needs.clippy.result }}" >> $GITHUB_STEP_SUMMARY  
          echo "**Format Status:** ${{ needs.format.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🎯 Projects processed:" >> $GITHUB_STEP_SUMMARY
          echo "$changed_projects" | jq -r '.[] | "- `" + . + "`"' >> $GITHUB_STEP_SUMMARY || echo "- No projects processed" >> $GITHUB_STEP_SUMMARY
